<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last Spellbound</title>
    <link rel="shortcut icon" href="assets/icons/Favicon.png" type="image/x-icon">
    <link rel="preload" as="image" href="./assets/image/07-forest-backgrounds/PNG/Forest1/Pale/Forest1.png">
    <link rel="preload" as="font" type="font/otf" href="./assets/fonts/Straight%20pixel%20gothic.otf" crossorigin>

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <div id="game-container" class="game-container is-start-screen" role="region" aria-label="The Last Spellbound">
        <canvas id="game-canvas" width="720px" height="480px"></canvas>
        <button id="pause-button" class="pause-button" onclick="togglePause()"></button>
        <div id="start-screen" class="start-screen is-open is-waiting">
            <div class="start-wizard-area">
                <div class="start-wizard"></div>
            </div>
            <div class="start-content">
                <h1 class="start-title">The Last<br>Spellbound</h1>
                <div class="start-buttons">
                    <button class="start-button" onclick="startGame()">
                        <span class="menu-label">Start Game</span>
                    </button>
                    <button class="start-button">
                        <span class="menu-label">Controls</span>
                    </button>
                    <button class="start-button">
                        <span class="menu-label">Credits</span>
                    </button>
                    <button class="start-button">
                        <span class="menu-label">Impressum</span>
                    </button>
                </div>
            </div>
        </div>
        <div id="game-over-screen" class="game-over-screen">
            <div class="game-over-content">
                <h2 id="game-over-title" class="game-over-title">GAME OVER</h2>
                <div class="game-over-buttons">
                    <button class="menu-button" onclick="restartLevel()">
                        <span class="menu-icon icon-retry"></span>
                        <span class="menu-label">Retry</span>
                    </button>
                    <button class="menu-button" onclick="goHome()">
                        <span class="menu-icon icon-home"></span>
                        <span class="menu-label">Home</span>
                    </button>
                </div>
            </div>
        </div>
        <div id="pause-menu" class="pause-menu">
            <h2 class="pause-title">Pause</h2>
            <div class="menu-buttons">
                <button class="menu-button" onclick="togglePause()">
                    <span class="menu-icon icon-back"></span>
                    <span class="menu-label">Back</span>
                </button>
                <button class="menu-button" onclick="restartLevel()">
                    <span class="menu-icon icon-retry"></span>
                    <span class="menu-label">Retry</span>
                </button>
                <button class="menu-button" onclick="goHome()">
                    <span class="menu-icon icon-home"></span>
                    <span class="menu-label">Home</span>
                </button>
            </div>
        </div>
        <div id="screen-fade" class="screen-fade"></div>
    </div>

    <script src="./scripts/game-settings.js"></script>
    <script src="./scripts/helper-functions.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./classes/models/drawable-object.class.js"></script>
    <script src="./classes/models/status-bar.class.js"></script>
    <script src="./classes/models/movable-object.class.js"></script>
    <script src="./classes/models/tile.class.js"></script>
    <script src="./classes/models/projectile.class.js"></script>
    <script src="./classes/levels/level.class.js"></script>
    <script src="./classes/models/character-sprites.js"></script>
    <script src="./classes/models/character-movement.class.js"></script>
    <script src="./classes/models/character.class.js"></script>
    <script src="./classes/models/enemy.class.js"></script>
    <script src="./classes/models/bear.class.js"></script>
    <script src="./classes/models/mage-boss.class.js"></script>
    <script src="./classes/models/enemy-markers.js"></script>
    <script src="./classes/models/level-item.class.js"></script>
    <script src="./classes/models/collectible.class.js"></script>
    <script src="./classes/models/key.class.js"></script>
    <script src="./classes/models/pizza.class.js"></script>
    <script src="./classes/models/donut.class.js"></script>
    <script src="./classes/models/chest.class.js"></script>
    <script src="./classes/models/portal.class.js"></script>
    <script src="./classes/models/portal-transition.class.js"></script>
    <script src="./classes/models/item-markers.js"></script>
    <script src="./classes/models/fireball.class.js"></script>
    <script src="./classes/models/boss-fireball.class.js"></script>
    <script src="./classes/models/boss-ray.class.js"></script>
    <script src="./classes/models/world.class.js"></script>
    <script src="./classes/models/background-object.class.js"></script>
    <script src="./classes/models/keyboard.class.js"></script>
    <script src="./classes/levels/level-one.js"></script>
    <script src="./classes/levels/level-one-boss.js"></script>
    <script src="./script.js"></script>
</body>

</html>
