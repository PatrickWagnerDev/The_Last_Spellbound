<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Guide</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: sans-serif;
            padding: 24px;
        }

        .guide-table {
            border-collapse: collapse;
            margin-bottom: 32px;
        }

        .guide-table td {
            padding: 8px 16px;
            border-bottom: 1px solid #555555;
            vertical-align: middle;
        }

        .key-cap {
            display: inline-block;
            min-width: 24px;
            padding: 4px 8px;
            border: 1px solid #888888;
            border-radius: 4px;
            background-color: #3d3d3d;
            text-align: center;
            font-weight: bold;
        }

        .key-separator {
            margin: 0 8px;
            color: #aaaaaa;
        }

        .item-image {
            width: 64px;
            height: 64px;
            background-position: 0 0;
            image-rendering: pixelated;
            outline: 1px solid #555555;
        }

        .key-image {
            background-image: url('./assets/image/06-tileset/Objects_Animated/Golden_Key.png');
            background-size: 768px 64px;
        }

        .pizza-image {
            background-image: url('./assets/image/06-tileset/Objects/Food/Pizza.png');
            background-size: 64px 64px;
        }

        .donut-image {
            background-image: url('./assets/image/06-tileset/Objects/Food/Donut.png');
            background-size: 64px 64px;
        }
    </style>
</head>

<body>
    <h1>Game Guide</h1>

    <h2>Controls</h2>
    <table class="guide-table">
        <tr>
            <td>Move left / right</td>
            <td>
                <span class="key-cap">A</span><span class="key-cap">D</span>
                <span class="key-separator">or</span>
                <span class="key-cap">&larr;</span><span class="key-cap">&rarr;</span>
            </td>
        </tr>
        <tr>
            <td>Jump</td>
            <td>
                <span class="key-cap">W</span>
                <span class="key-separator">/</span>
                <span class="key-cap">&uarr;</span>
                <span class="key-separator">/</span>
                <span class="key-cap">Space</span>
            </td>
        </tr>
        <tr>
            <td>Roll (invulnerable while rolling)</td>
            <td>
                <span class="key-cap">S</span>
                <span class="key-separator">/</span>
                <span class="key-cap">&darr;</span>
            </td>
        </tr>
        <tr>
            <td>Melee attack</td>
            <td>
                <span class="key-cap">J</span>
                <span class="key-separator">/</span>
                <span class="key-cap">X</span>
            </td>
        </tr>
        <tr>
            <td>Fireball (costs 1 energy)</td>
            <td>
                <span class="key-cap">K</span>
                <span class="key-separator">/</span>
                <span class="key-cap">C</span>
            </td>
        </tr>
    </table>

    <h2>Collectibles</h2>
    <table class="guide-table">
        <tr>
            <td><div class="item-image key-image"></div></td>
            <td>Golden Key</td>
            <td>Opens the chest (the key is used up)</td>
        </tr>
        <tr>
            <td><div class="item-image pizza-image"></div></td>
            <td>Pizza</td>
            <td>Heals 1 HP</td>
        </tr>
        <tr>
            <td><div class="item-image donut-image"></div></td>
            <td>Donut</td>
            <td>Refills the whole energy bar</td>
        </tr>
    </table>
</body>

</html>
